name: Streamlit Keep Alive

on:
  schedule:
    # Runs every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            https://creator-sourcing-tool-ckxrdshrtveicftmrrkbvo.streamlit.app/
